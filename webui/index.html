<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Zygisk Next Next</title>
  </head>
  <body>
    <m3e-theme
      id="znn-theme"
      color="#6750a4"
      scheme="light"
      motion="expressive"
      density="-2"
    >
      <znn-top-bar></znn-top-bar>
      <main id="content" class="content"></main>
      <znn-footer></znn-footer>
    </m3e-theme>
    <script>
      (function () {
        var scheme = 'light';
        try {
          var saved = localStorage.getItem('znn_theme');
          if (saved === 'light' || saved === 'dark') {
            scheme = saved;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            scheme = 'dark';
          }
        } catch (e) {}
        var host = document.getElementById('znn-theme');
        if (host) host.setAttribute('scheme', scheme);
        document.documentElement.style.colorScheme = scheme;
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
